<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер контактів</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Менеджер контактів</h1>

        <form id="contact-form" class="contact-form">
            <input type="hidden" id="contact-id" name="id">

            <div class="form-group">
                <label for="first-name">Ім'я:</label>
                <input type="text" id="first-name" name="firstName" required placeholder="Введіть ім'я">
            </div>

            <div class="form-group">
                <label for="last-name">Прізвище:</label>
                <input type="text" id="last-name" name="lastName" required placeholder="Введіть прізвище">
            </div>

            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" required placeholder="+380(XX) XXX-XX-XX">
            </div>

            <div class="form-group">
                <label for="email">Електронна адреса:</label>
                <input type="email" id="email" name="email" required placeholder="pespatron@gmail.com">
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn" class="btn btn-primary">Додати контакт</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Скасувати</button>
            </div>
        </form>

        <h2>Список контактів</h2>
        <div id="contacts-list" class="contacts-list"></div>
    </div>

    <script type="module" src="application.js"></script>
</body>

</html>
